name: Build and Deploy

on:
    push:
        branches:
            - master

permissions:
    contents: write

# Unit tests and browser tests run side by side. The site is only deployed
# when both pass.
jobs:
    test:
        name: Unit tests and build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v4
              with:
                  # The build stamps the git commit into the app.
                  fetch-depth: 0

            # The test runner needs Node 22 or newer for glob patterns.
            - name: Set up Node ⚙️
              uses: actions/setup-node@v4
              with:
                  node-version: 'lts/*'
                  cache: npm

            - name: Install, test, and build 🔧
              run: |
                  npm ci
                  npm test
                  npm run build

            - name: Keep the build for deploying 📦
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist

    e2e:
        name: Browser tests
        runs-on: ubuntu-latest
        # Screenshot baselines were made in this image, so fonts and rendering
        # match. Keep the version in step with @playwright/test.
        container:
            image: mcr.microsoft.com/playwright:v1.63.0-noble
            options: --ipc=host

        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install 🔧
              run: npm ci

            - name: Test in Chromium, Firefox, and WebKit 🧪
              # Firefox refuses to run when HOME belongs to another user.
              env:
                  HOME: /root
              run: npx playwright test

            - name: Keep the report when something fails 📋
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report
                      test-results
                  retention-days: 14

    deploy:
        name: Deploy
        needs: [test, e2e]
        runs-on: ubuntu-latest

        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v4

            - name: Get the build 📦
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: dist
                  single-commit: true
