<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/favicon.ico" sizes="any">
        <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
        <meta name="description" content="A collection of offline utilities in a simple, no-frills web app. Excellent, handy tools and great for spare phones." />
        <title>Be Prepared</title>
        <script src="main.ts" type="module"></script>
        <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
        <meta name="color-scheme" content="light dark" />
        <style>
            :root {
                --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

                --bg: #f5f6f8;
                --surface: #ffffff;
                --surface-2: #eceef2;
                --border: #d5d9e0;
                --fg: #14171c;
                --fg-muted: #5b6470;
                --accent: #e8590c;
                --accent-fg: #ffffff;
                --accent-soft: rgba(232, 89, 12, 0.12);
                --accent-glow: rgba(232, 89, 12, 0.45);
                --success: #15803d;
                --danger: #b91c1c;
                --warning: #b45309;
                --warning-bg: #fef3c7;
                --overlay-bg: rgba(0, 0, 0, 0.55);
                --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.1);

                --space-1: 0.25rem;
                --space-2: 0.5rem;
                --space-3: 0.75rem;
                --space-4: 1rem;
                --space-5: 1.5rem;
                --radius-s: 8px;
                --radius-m: 12px;
                --radius-l: 18px;
                --tap: 3.25rem;

                /* Older names still used by some screens */
                --active-background-color: var(--accent-soft);
                --changeable-setting-underline-color: var(--accent);
                --bg-color: var(--bg);
                --fg-color: var(--fg);
                --button-bg-color: var(--surface-2);
                --button-bg-color-enabled: var(--accent-soft);
                --button-fg-color-enabled: var(--accent);
                --button-border: 2px solid var(--border);
                --link-color: var(--accent);
                --table-border: 1px solid var(--border);
                --navigate-color: var(--accent);
                --toast-border: 1px solid var(--border);
                --toast-bg-color: var(--surface);
            }

            /* Pure black in dark mode: OLED screens turn those pixels off,
               which saves battery. Browsers can't tell us the screen type. */
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #000000;
                    --surface: #111316;
                    --surface-2: #1c1f24;
                    --border: #2c3138;
                    --fg: #f2f4f7;
                    --fg-muted: #9aa3ae;
                    --accent: #ff8a3d;
                    --accent-fg: #1a0e05;
                    --accent-soft: rgba(255, 138, 61, 0.16);
                    --accent-glow: rgba(255, 138, 61, 0.55);
                    --success: #4ade80;
                    --danger: #f87171;
                    --warning: #fbbf24;
                    --warning-bg: rgba(251, 191, 36, 0.12);
                    --shadow: none;
                }
            }

            html {
                height: 100%;
                margin: 0;
                -webkit-text-size-adjust: 100%;
            }

            body {
                background-color: var(--bg);
                color: var(--fg);
                margin: 0;
                height: 100%;
                overflow: hidden;
                font-family: var(--font);
                line-height: 1.45;
                -webkit-tap-highlight-color: transparent;
                -webkit-font-smoothing: antialiased;
            }

            input,
            select,
            textarea,
            button {
                font-family: inherit;
            }

            ::selection {
                background: var(--accent-soft);
            }
        </style>
    </head>
    <body>
    </body>
</html>
